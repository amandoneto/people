# Configuração do PostgreSQL
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/people
quarkus.datasource.username=${USERDB}
quarkus.datasource.password=${PASSDB}
# Enables displaying SQL queries in the console
quarkus.hibernate-orm.log.sql=true
# Formats the generated SQL to be structured and readable across multiple lines
quarkus.hibernate-orm.log.format-sql=true
# (Optional) Displays the actual parameter values passed (replaces '?' with the values)
quarkus.hibernate-orm.log.bind-parameters=true
# Disable table creation
quarkus.hibernate-orm.schema-management.strategy=none
# Keep Hibernate JSON persistence formatting independent from REST Jackson configuration.
quarkus.hibernate-orm.mapping.format.global=ignore
# Default level for development, test, or other environments (INFO)
quarkus.log.level=INFO
# Overrides to WARN strictly when the application runs in production mode (%prod)
%prod.quarkus.log.level=WARN
# JWT signing and verification. Override JWT_SECRET in deployed environments.
security.jwt.secret=${JWT_SECRET}
security.jwt.jwk=${JWT_JWK}
smallrye.jwt.sign.key=${security.jwt.jwk}
smallrye.jwt.verify.secretkey=${security.jwt.jwk}
smallrye.jwt.verify.algorithm=HS256
mp.jwt.verify.issuer=people-api
# Kafka producer and consumer for the project topic.
mp.messaging.connector.smallrye-kafka.bootstrap.servers=localhost:9092
mp.messaging.outgoing.project-topic-out.connector=smallrye-kafka
mp.messaging.outgoing.project-topic-out.topic=project-topic
mp.messaging.outgoing.project-topic-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
# Maximum wait for an individual Kafka broker request; this is not a total HTTP request timeout.
mp.messaging.outgoing.project-topic-out.request.timeout.ms=5000
# Maximum time for one Kafka record send, including broker retries; application retries can multiply this.
mp.messaging.outgoing.project-topic-out.delivery.timeout.ms=15000
mp.messaging.incoming.project-topic-in.connector=smallrye-kafka
mp.messaging.incoming.project-topic-in.topic=project-topic
mp.messaging.incoming.project-topic-in.group.id=people-project-consumer
mp.messaging.incoming.project-topic-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Nacked messages are forwarded here; provision this topic on the Kafka broker.
mp.messaging.incoming.project-topic-in.failure-strategy=dead-letter-queue
mp.messaging.incoming.project-topic-in.dead-letter-queue.topic=project-topic-dlq
mp.messaging.incoming.project-topic-in.dead-letter-queue.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.connector.smallrye-kafka.reconnect.backoff.ms=1000
mp.messaging.connector.smallrye-kafka.reconnect.backoff.max.ms=10000
# Maximum time KafkaProducer.send() may wait for metadata or buffer space on each send attempt.
mp.messaging.outgoing.project-topic-out.max.block.ms=2000
# Hard cap for the full publish operation, including all retries and retry delays.
# Kept below 15 seconds to leave time for the REST response to be sent.
kafka.project.publish.timeout=PT14S
# Number of retries after the initial publish attempt (4 attempts total when set to 3).
kafka.project.publish.max-retries=3
# Delay before the first retry; later delays grow exponentially, up to the configured maximum.
kafka.project.publish.retry.initial-delay=PT1S
# Maximum delay between retries; this does not limit the total operation duration.
kafka.project.publish.retry.max-delay=PT3S
# Allow the local Angular development server; set CORS_ORIGINS to exact frontend origins when deployed.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:4200}
quarkus.http.cors.methods=GET,POST,PUT,DELETE
quarkus.http.cors.headers=Accept,Authorization,Content-Type
quarkus.http.cors.access-control-allow-credentials=false